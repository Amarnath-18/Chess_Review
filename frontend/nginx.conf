server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # The API caps request bodies itself; refuse oversized ones here first.
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Set once at server level (an add_header inside a location would replace these).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;  # looking up games on Chess.com / Lichess can take a while

        # nginx sets these for every response (above); drop the API's copies so none is doubled.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
    }

    # Built files have content hashes in their names, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Single-page app: any other path serves index.html. It must never be cached, or a new release
    # would not be picked up.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
